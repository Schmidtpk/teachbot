# IID-TEST-MODEL-COMPARE
# Model/prompt variants for comparison testing.
# Each variant runs all test cases and results are compared in a table.
#
# Fields:
#   id:                     unique identifier shown in the report
#   model:                  OpenRouter model string
#   temperature:            0.0–1.0 (omit to use config.yaml default)
#   max_tokens:             (omit to use config.yaml default)
#   system_prompt_override: (null = use default prompt from app.py)

variants:
  - id: gemini-flash
    model: google/gemini-3-flash-preview
    temperature: 0.3
    system_prompt_override: null

  - id: deepseek-v4-pro
    model: deepseek/deepseek-v4-pro
    temperature: 0.3
    system_prompt_override: null

  - id: claude-sonnet
    model: anthropic/claude-sonnet-4-6
    temperature: 0.3
    system_prompt_override: null

  - id: gemini-pro
    model: google/gemini-3.1-pro-preview
    temperature: 0.3
    system_prompt_override: null

  - id: glm-5.2
    model: z-ai/glm-5.2
    temperature: 0.3
    system_prompt_override: null

  # Legacy temperature variants (gemini-flash only):
  # - id: low-temp
  #   model: google/gemini-3-flash-preview
  #   temperature: 0.0
  #   system_prompt_override: null
  # - id: high-temp
  #   model: google/gemini-3-flash-preview
  #   temperature: 1.0
  #   system_prompt_override: null
