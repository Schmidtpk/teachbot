# IID-MULTI-DEPLOY, IID-EDUCATOR-CONFIG, SID-API-CONFIG
# Config for the Basel time-series deploy (Railway service `teachbot-timeseries`).
# Selected there via the env var TEACHBOT_CONFIG=config_timeseries.yaml. Same repo as
# the Heidelberg student deploy (config.yaml) and the free public deploys.
# Login required (stud.unibas.ch).

course_name: "Univariate Time Series Analysis"

# IID-MULTI-DEPLOY: each deploy points to its own content folder.
# content_timeseries/ has two course subfolders (IID-MULTI-COURSE): lecture/ (plain Q&A,
# IID-QNA-CORE) and assignment1/ (step-by-step assignment helper, IID-ASSIGNMENT-HELP).
content_dir: content_timeseries   # IID-LECTURE-CONTENT
logs_dir: logs                    # IID-CHAT-LOG
sheets_log_id: "16xdFMSLu7T4Cgy3pu10JKn78EKCe8vz1tGkDa8xcq1g"  # IID-SHEETS-LOG: "Lectos Timeseries logs" Sheet

# IID-AUTH-BASIC: students log in with their Basel address; first login = registration.
auth:
  allowed_domains:
    - stud.unibas.ch
  allowed_emails: []

# IID-WEEKLY-REPORT: accounts inside allowed_domains that are not students (lecturer tests).
# Marked NON-STUDENT in the weekly report and left out of student counts, focus and struggles.
weekly_report:
  non_student_emails:
    - me@stud.unibas.ch

# LLM settings — SID-LLM-PROVIDER
# This service has its own OPENROUTER_API_KEY (Railway variable), separate budget.
llm:
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna   # SID-LLM-PROVIDER
  temperature: 0.3
  max_tokens: 4096
  # IID-LLM-THINKING: chain-of-thought off by default. Reasoning models cost time-to-first-token,
  # which is what produced a 13.7% "taking too long" rate on 2026-09-18 under the previous
  # model (deepseek/deepseek-v4-flash-0731, see IID-STREAM-RESILIENCE).
  # check_reasoning_support.py --live, 2026-10-06: 7/7 providers declare `reasoning`;
  # reasoning=false honoured (96 -> 0 reasoning deltas, first content 3.4s -> 1.0s).
  # Switched from deepseek-v4-flash 2026-10-06 after replaying the week's failed helper turns
  # (8 replies per variant): deepseek leaked reference-solution numbers / wrote students'
  # answers / made false claims; Luna (thinking off) did none of these, first token 1-2s.
  # deepseek with low thinking was not an option: 30-70s to first token, 1/8 never answered.
  reasoning: false

# IID-STUDENT-MODEL-CHOICE, IID-LLM-THINKING: students can switch in the ⚙ Chat Settings
# menu; the change applies from their next message. Same model twice, differing only in
# whether it thinks first — so labels (not ids) are what distinguishes them.
# Before adding a model here, confirm it honours the parameter:
#   python scripts/check_reasoning_support.py <model-id>
student_model_choices:
  - id: openai/gpt-6-luna
    label: "Fast (no thinking)"
    reasoning: false
  - id: openai/gpt-6-luna
    label: "Thorough (thinks first, slower)"
    reasoning: true
