# IID-STUDENT-MODEL-CHOICE: global fallback model list.
# Courses that define their own student_model_choices in _meta.yaml override this.
# Cheap models only (OpenRouter $/M tokens in/out, 2026-10-06). The first entry must match
# config.yaml `llm.model`, so the chooser preselects the model actually in use.
# IID-LLM-THINKING: no `reasoning` set on any entry. check_reasoning_support.py --live, 2026-10-06:
#   claude-sonnet-5.5 8/8 providers, but rejects reasoning=false ("Reasoning is mandatory");
#     with it unset: 0 reasoning deltas, first content 1.3-1.7s
#   gpt-6-luna 7/7 providers, 0 reasoning deltas either way, first content 1.0-1.3s
#   deepseek-v4-pro reasons by default (76 deltas, first content 6.8s) - "Thinking..." step covers it
student_model_choices:
  - id: "deepseek/deepseek-v4-pro"
    label: "DeepSeek v4 Pro"    # default model (matches config.yaml); $0.21/$0.42
  - id: "anthropic/claude-sonnet-5.5"
    label: "Claude Sonnet 5.5"  # $2/$10
  - id: "google/gemini-3-flash-preview"
    label: "Gemini 3 Flash"     # $0.50/$3
  - id: "openai/gpt-6-luna"
    label: "GPT-6 Luna"         # $0.10/$0.50
