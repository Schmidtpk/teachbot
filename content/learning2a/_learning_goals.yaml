# IID-LEARN-GOALS: each goal is sampled one at a time; only the sampled goal enters the LLM context.
# `id` must be unique and stable (it is the key stored in the per-student progress sheet).
# `title` is optional (shown to the model as a short label); `goal` is required.
# `material` is optional: code/formulas/data the student must literally see — the app appends
# it verbatim below the opening question (display never depends on the LLM copying it).
# Goals follow the slide order of script2.1 (Elicitation of predictions + incentives) and
# script2.2 (Evaluation of predictions), Part II: Subjective judgement.
goals:
  # --- Elicitation (script 2.1) ---
  - id: event_target_properties
    title: "What to elicit for events"
    goal: "Student can distinguish the properties one may elicit for an event — a probability p̂, a point (yes/no) prediction, or a range of probabilities — rank them by information content (range of probabilities > probability > point prediction), and explain the opposing trade-off with ease of use, so the choice balances information against how reliably respondents can answer. Student can also explain why point predictions and unspecified verbal scales ('likely') are less informative (no weighing of utility differences; verbal terms mean different probabilities to different people)."

  - id: real_target_properties
    title: "What to elicit for real-valued targets"
    goal: "Student can explain that for a real-valued target the ideal object is a full probability distribution (cdf or pdf), that common point predictions should be understood as properties of that distribution (mean, mode, maximum/minimum), and that because full distributions are hard to elicit we instead approximate them — e.g. by eliciting interval probabilities P(y ≤ c) or quantiles and fitting a distribution to them."

  - id: proper_scoring_incentive
    title: "Proper scoring rules as incentives"
    goal: "Student can describe the scoring-rule contract (expert issues p̂, outcome y realizes, expert is paid s(p̂,y)) and state the incentive result: if the expert maximizes expected payout and s is a proper scoring rule, then reporting the true belief p is optimal. Student can also explain the second advantage — proper rules reward gathering more information, since an ideal prediction using more information has a (weakly) higher expected score."

  - id: scoring_rule_problems
    title: "When scoring-rule incentives fail"
    goal: "Student can name and explain the situations in which proper-scoring-rule incentives break down: the outcome must be observable; risk aversion means the expert maximizes expected utility of the payout rather than expected payout; personal stakes let the expert hedge (bias the report toward unfavorable outcomes); and reputation concerns (public performance) can push toward overly extreme or overly non-committal predictions."

  # --- Evaluation (script 2.2) ---
  - id: calibration_events
    title: "Calibration & the calibration curve"
    goal: "Student can state the definition of calibration for an event prediction, E[y | p̂] = p̂, and explain how to test it on data (the average outcome among all predictions of value c should equal c, or predictions close to c should be close to c), and describe how the empirical calibration curve is built — for each predicted value c, average the realized y over the observations with p̂ᵢ = c — noting that inference on it requires confidence intervals/tests and care with multiple testing."

  - id: pit_reals
    title: "PIT & PIT histograms"
    goal: "Student can define the Probability Integral Transform PIT(y, P̂) = F̂(y), state that a calibrated probabilistic prediction for a continuous real-valued target implies PIT ~ Uniform[0,1], and read a PIT histogram: a hump/skew away from uniform signals miscalibration (e.g. a location shift ⇒ biased mean/overoptimistic; too-narrow predictive distribution ⇒ overprecise with too many extreme PITs; too-wide ⇒ underprecise with PITs bunched in the middle). (The chat interface cannot show Figures, so you need to rely on text testing this.)"

  - id: interval_coverage
    title: "Coverage of prediction intervals"
    goal: "Student can define the empirical coverage of a (1−α) prediction interval as the fraction of observations whose outcome falls inside the interval, and interpret deviations from the nominal level: undercoverage (coverage < 1−α) means intervals are too narrow / overprecise, overcoverage (coverage > 1−α) means intervals are too wide / underprecise."

  - id: accuracy_scores
    title: "Comparing accuracy with average scores"
    goal: "Student can explain how predictive accuracy is measured empirically with a proper scoring rule — compute sᵢ = s(yᵢ, p̂ᵢ) and average to approximate S(p̂), the more accurate prediction earning the higher average score in the long run — and how two predictions are compared by testing the mean score difference Δs = s(y,p̂_A) − s(y,p̂_B) against H₀: equal expected scores (often against the ignorant benchmark p̂ = 0.5)."